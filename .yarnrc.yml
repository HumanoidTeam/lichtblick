approvedGitRepositories:
  - "github.com/lichtblick-suite/*"

changesetBaseRefs:
  - main
  - origin/main

compressionLevel: mixed

defaultSemverRangePrefix: ""

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

# Minutes (yarn declares this setting as type DURATION with unit "m"). 7 days,
# matching the minimum release age HMND applies to its other package managers.
npmMinimalAgeGate: 10080

patchFolder: ./patches

yarnPath: .yarn/yarn-wrapper.js
